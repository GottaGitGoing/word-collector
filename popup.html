<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 340px; margin: 0; font: 14px/1.45 system-ui, sans-serif; background: #171a23; color: #eceef4; }
  header { padding: 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid #2a2e3d; }
  header h1 { margin: 0; font-size: 16px; }
  #search { padding: 6px 10px; border-radius: 8px; border: 1px solid #3a3f52; background: #1e2230; color: inherit; outline: none; }
  #list { list-style: none; margin: 0; padding: 0; max-height: 360px; overflow-y: auto; }
  .item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; }
  .item:hover { background: #1e2230; }
  .item .word { font-weight: 600; min-width: 80px; }
  .lang { font-size: 10px; background: #2c3145; color: #9aa3c0; border-radius: 4px; padding: 1px 5px; margin-left: 6px; }
  .item .translation { flex: 1; color: #9fd3a8; overflow-wrap: anywhere; }
  .item .delete { background: none; border: none; color: #666e88; cursor: pointer; }
  .item .delete:hover { color: #ff6b6b; }
  .empty { padding: 20px 12px; color: #767e97; text-align: center; }
  footer { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-top: 1px solid #2a2e3d; }
  #export { background: #2c3145; color: #cfd3e0; border: none; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
  #count { color: #767e97; font-size: 12px; }
</style>
</head>
<body>
  <header>
    <h1>📖 My Words</h1>
    <input id="search" type="search" placeholder="Search…">
  </header>
  <ul id="list"></ul>
  <footer>
    <button id="export">Export CSV</button>
    <span id="count"></span>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
