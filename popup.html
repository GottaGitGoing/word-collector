<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 340px; margin: 0; font: 14px/1.45 system-ui, sans-serif; background: #171a23; color: #eceef4; }
  header { padding: 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid #2a2e3d; }
  header h1 { margin: 0; font-size: 16px; }
  #search { padding: 6px 10px; border-radius: 8px; border: 1px solid #3a3f52; background: #1e2230; color: inherit; outline: none; }
  .reviewBar { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid #2a2e3d; background: #1b1f2c; }
  #dueInfo { font-size: 13px; color: #9aa3c0; }
  #dueInfo b { color: #f5b04c; }
  .reviewBar .btns { display: flex; gap: 6px; }
  .reviewBar button { border: none; border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
  #reviewDue { background: #3b82f6; color: #fff; }
  #practice { background: #2c3145; color: #cfd3e0; }
  #practice:disabled { opacity: .4; cursor: default; }
  #list { list-style: none; margin: 0; padding: 0; max-height: 340px; overflow-y: auto; }
  .item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; }
  .item:hover { background: #1e2230; }
  .item .word { font-weight: 600; min-width: 80px; }
  /* shared badge base */
.lang, .box {
  font-size: 10px;
  border-radius: 4px;
  padding: 1px 5px;
  margin-left: 6px;
}

/* lang badge is a <button> — reset button defaults, add colors */
.lang {
  background: #2c3145;
  color: #9aa3c0;
  border: none;
  cursor: pointer;
  font-family: inherit;
}
.lang:hover { background: #3b82f6; color: #fff; }

/* box badge is just a label */
.box { background: #1d3a2a; color: #7fc99a; }

/* inline language dropdown */
.langEdit {
  font-size: 11px;
  padding: 1px 4px;
  margin-left: 6px;
  border-radius: 4px;
  border: 1px solid #3b82f6;
  background: #1e2230;
  color: #eceef4;
  outline: none;
  max-width: 140px;
}
  .item .translation { flex: 1; color: #9fd3a8; overflow-wrap: anywhere; }
  .item .delete { background: none; border: none; color: #666e88; cursor: pointer; }
  .item .delete:hover { color: #ff6b6b; }
  .empty { padding: 20px 12px; color: #767e97; text-align: center; }
  footer { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-top: 1px solid #2a2e3d; }
  #export { background: #2c3145; color: #cfd3e0; border: none; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; }
  #count { color: #767e97; font-size: 12px; }
</style>
</head>
<body>
  <header>
    <h1>📖 My Words</h1>
    <input id="search" type="search" placeholder="Search…">
    <button id="clipBtn" style="width:100%; padding:8px; margin-top:4px; border:none; border-radius:6px; background:#4c516d; color:#fff; cursor:pointer; font-size:13px;">
      📋 Save from Clipboard
    </button>
  </header>
  <div class="reviewBar">
    <span id="dueInfo"><b>0</b> due</span>
    <div class="btns">
      <button id="reviewDue">Review</button>
      <button id="practice">Practice</button>
    </div>
  </div>
  <ul id="list"></ul>
  <footer>
    <button id="export">Export CSV</button>
    <span id="count"></span>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
